name: Android NDK
description: >
  Installs the NDK and the CMake that the generated Expo project's Gradle build asks for, from a
  cache when it can, so Gradle never downloads either in the middle of a build. Run it after
  `expo prebuild` and before any Gradle step. Used by native-side-by-side.yml, native-release.yml
  and mobile.yml (#3573, CMake since 3 Nov).

runs:
  using: composite
  steps:
    # One source for the version: React Native's own version catalog, which is what the generated
    # project's `rootProject.ext.ndkVersion` resolves to. A project that pins a different one in
    # its Gradle files is caught here, not discovered as a mid-build download.
    - name: Read the NDK version the project asks for
      id: version
      shell: bash
      run: |
        set -euo pipefail
        catalog="$GITHUB_WORKSPACE/mobile/node_modules/react-native/gradle/libs.versions.toml"
        version="$(sed -nE 's/^ndkVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$catalog" | head -n 1)"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "::error::Could not read ndkVersion from $catalog (got '${version:-nothing}')."; exit 1; }
        pinned="$(grep -rhE '^[[:space:]]*(ndkVersion|ext\.ndkVersion)[[:space:]]*[=(]?[[:space:]]*["'"'"'][0-9]' \
          "$GITHUB_WORKSPACE/mobile/android" --include='*.gradle' || true)"
        if [ -n "$pinned" ] && ! grep -qF "$version" <<< "$pinned"; then
          echo "::error::The generated project pins a different NDK than React Native's $version:"; echo "$pinned"; exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # ANDROID_HOME is a runner variable, which the `env` expression context does not see, so
        # the cache path is worked out here.
        echo "dir=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"
        echo "NDK_VERSION=$version" >> "$GITHUB_ENV"
        # CMake: no native library here pins a version (react-native-nitro-modules and expo-sqlite
        # build with CMake), so the Android Gradle plugin installs its default, 3.22.1, mid-build.
        # A truncated download of it failed a Preview build on 3 Nov ("Error on ZipFile unknown
        # archive"). If the plugin's default changes, the build log names the new version and this
        # line follows it.
        cmake=3.22.1
        echo "cmake=$cmake" >> "$GITHUB_OUTPUT"
        echo "cmake_dir=$ANDROID_HOME/cmake/$cmake" >> "$GITHUB_OUTPUT"
        echo "CMAKE_VERSION=$cmake" >> "$GITHUB_ENV"

    - name: Restore the NDK cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.version.outputs.dir }}
        key: android-ndk-${{ runner.os }}-${{ steps.version.outputs.version }}

    # A dropped or corrupt download is caught and retried here. An install counts only if the
    # NDK's source.properties exists afterwards; a partial folder is removed between attempts.
    - name: Install the NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -uo pipefail
        dir="$ANDROID_HOME/ndk/$NDK_VERSION"
        for attempt in 1 2 3; do
          echo "Installing ndk;$NDK_VERSION (attempt $attempt of 3)"
          rm -rf "$dir"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" || true
          if [ -f "$dir/source.properties" ]; then
            echo "NDK $NDK_VERSION installed."; exit 0
          fi
          echo "::warning::NDK install attempt $attempt did not leave $dir/source.properties."
        done
        rm -rf "$dir"
        echo "::error::Could not install ndk;$NDK_VERSION after 3 attempts."
        exit 1

    # A restored cache is checked the same way, so a damaged one fails here, clearly.
    - name: Check the NDK is whole
      shell: bash
      run: |
        [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ] || {
          echo "::error::$ANDROID_HOME/ndk/$NDK_VERSION/source.properties is missing."; exit 1; }

    - name: Restore the CMake cache
      id: cmake-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.version.outputs.cmake_dir }}
        key: android-cmake-${{ runner.os }}-${{ steps.version.outputs.cmake }}

    # Same rule as the NDK: retried on a dropped or corrupt download, and an install counts only if
    # the cmake binary exists afterwards.
    - name: Install CMake
      if: steps.cmake-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -uo pipefail
        dir="$ANDROID_HOME/cmake/$CMAKE_VERSION"
        for attempt in 1 2 3; do
          echo "Installing cmake;$CMAKE_VERSION (attempt $attempt of 3)"
          rm -rf "$dir"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;$CMAKE_VERSION" || true
          if [ -x "$dir/bin/cmake" ]; then
            echo "CMake $CMAKE_VERSION installed."; exit 0
          fi
          echo "::warning::CMake install attempt $attempt did not leave $dir/bin/cmake."
        done
        rm -rf "$dir"
        echo "::error::Could not install cmake;$CMAKE_VERSION after 3 attempts."
        exit 1

    - name: Check CMake is whole
      shell: bash
      run: |
        [ -x "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" ] || {
          echo "::error::$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake is missing."; exit 1; }
