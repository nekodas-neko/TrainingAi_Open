name: Issue intake

# Everything that arrives as an issue has to be *visible as untriaged*, or it sits in the list
# looking the same as work somebody has already thought about. The three issue templates apply
# `needs: triage` themselves; this catches the two cases they cannot — a blank issue, and an
# issue opened through the API by an agent.
#
# It labels and nothing else. Deciding the area, the priority and which role takes it is the
# Orchestrator's triage pass, and that is a judgement an `if` cannot make: the whole reason a
# human-written bug report needs reading is that its title is not its content.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  mark-untriaged:
    name: Mark as needing triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Add 'needs: triage' unless it is already classified"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # An issue that already carries an agent: label was filed by someone who knew where it
          # goes — typically the Orchestrator splitting work out of another issue. Re-marking it
          # untriaged would send it back through a pass it has already had.
          case ",$LABELS," in
            *,agent:*) echo "Already assigned to an agent; leaving it alone."; exit 0 ;;
          esac
          case ",$LABELS," in
            *",needs: triage,"*) echo "Already marked."; exit 0 ;;
          esac
          gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=needs: triage"
          echo "Marked #$NUMBER as needing triage."
