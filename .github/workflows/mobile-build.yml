name: Native mobile build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform
        required: true
        default: android
        type: choice
        options: [ios, android]
      profile:
        description: Build profile
        required: true
        default: development
        type: choice
        options: [development, preview, production]

permissions:
  contents: read

concurrency:
  group: native-build-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.platform == 'android' && inputs.profile != 'development' && 'native-replacement' || 'native-development' }}
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_PLATFORM: ${{ inputs.platform }}
      APP_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.0
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Require approval for existing Android key custody
        if: inputs.platform == 'android' && inputs.profile != 'development'
        env:
          APPROVED: ${{ vars.NATIVE_ANDROID_EAS_SIGNING_APPROVED }}
          EXPECTED: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          test "$APPROVED" = "true" || { echo "Approve Expo custody of the existing signing key in the native-replacement environment before building."; exit 1; }
          test -n "$EXPECTED" || { echo "Configure the installed signing certificate SHA-256."; exit 1; }
      - name: Prepare isolated development signing credentials
        if: inputs.platform == 'android' && inputs.profile == 'development'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: node scripts/prepare-android-signing.mjs
      - name: Prepare approved replacement signing credentials
        if: inputs.platform == 'android' && inputs.profile != 'development'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          LEGACY_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android-signing.mjs
      - name: Verify the existing Android signing certificate
        if: inputs.platform == 'android' && inputs.profile != 'development'
        env:
          ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
        run: node scripts/check-android-signing.mjs
      - name: Build and publish through the existing Expo project
        run: node scripts/build-mobile.mjs --platform "$APP_PLATFORM" --profile "$APP_PROFILE" --no-open
      - name: Remove signing files
        if: always() && inputs.platform == 'android'
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          for (const path of ['credentials.json', 'android-signing.keystore']) rmSync(path, { force: true });
          NODE
