name: Android

# The Android job compiles the Kotlin plugin/service, runs the JVM protocol tests,
# and builds two debug APKs: the real app (`prod` flavour, com.trainingai.app) and
# TrainingAi Dev (`dev` flavour, com.trainingai.app.dev, #2367), which loads the
# laptop's dev server over `adb reverse` and never touches the ring, strap or scale.
# The real app loads the UI remotely from Railway
# (capacitor.config.ts server.url), so JS/server/docs changes never require an APK
# rebuild — only native/Kotlin/Capacitor changes do. Path-gating this whole workflow
# keeps ~6 billed minutes off the vast majority of runs, which are non-native.
#
# This is deliberately NOT a required status check, so path-filtering it is safe:
# a filtered-out run leaves no "Expected" check hanging on branch protection (unlike
# the required jobs in ci.yml, which must always run on every PR).
#
# `package.json` is deliberately NOT in the path list, even though dependency changes do
# need a rebuild. Every release bumps its `version` field, so including it rebuilt and
# republished the APK on literally every merge — six consecutive releases checked, all
# version-only, none native. That made the published APK's version track the app version
# exactly, which is what left the More -> update card permanently lit: it always had a
# "newer" APK to point at, for changes the WebView had already received. Dependency changes
# are covered by `pnpm-lock.yaml`, which pnpm always rewrites alongside package.json and
# which a version bump never touches.
on:
  pull_request:
    branches: [main]
    paths: &native-paths
      - 'android/**'
      - 'capacitor.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  # On push to main the build additionally publishes the rolling APK release, but
  # only when native files actually changed — a JS-only merge does not need a new APK.
  push:
    branches: [main]
    paths: *native-paths
  # Called by .github/workflows/release.yml after a release is tagged, so the tag carries an APK
  # built from exactly that commit. No `paths` here on purpose: a release always publishes an APK,
  # native change or not, so that `v<x>` is a complete, self-contained thing to install.
  workflow_call:
    inputs:
      release_tag:
        description: 'Attach the APK to this release tag instead of the rolling apk-latest'
        type: string
        required: true
  # Retrying the APK half of a release on its own, when the release itself landed but this did not.
  # Rebuilding from the tag reproduces the same commit, so it is the same APK in every way that
  # matters; nothing else in the release has to run again.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'The existing v* release to attach the APK to (e.g. v1.486.11)'
        type: string
        required: true

concurrency:
  # The release's call gets its own group. Sharing `main`'s would let an ordinary native push
  # cancel the APK build of a release that is already tagged, which cannot be retried into the
  # same tag.
  group: android-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Kotlin tests + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needed by the "Publish APK" step below to create/replace the rolling release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # A called run checks out the CALLER's ref by default, which is `main` — so a release of
          # an older commit would otherwise ship an APK built from main's HEAD. The tag exists by
          # the time this runs. Empty means "the default ref", which is the push/PR behaviour.
          ref: ${{ inputs.release_tag }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.0
      # Node 22, not 20: the Capacitor CLI 8.x (`npx cap sync`) requires >=22.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      # The android gradle project resolves Capacitor from node_modules.
      - run: pnpm install --frozen-lockfile
      # cap sync needs the webDir to exist; the APK loads the UI remotely
      # (capacitor.config.ts server.url), so an empty dir is fine.
      - run: mkdir -p www && npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Without this, every APK this workflow published was signed with a different key.
      # Gradle's fallback debug keystore is generated per machine and a runner is a fresh
      # machine each run, so successive APKs refused to install over one another and the
      # only way through was to uninstall first — which on an offline-first app drops any
      # outbox mutation that has not yet reached the server.
      #
      # The key is a credential and is never committed. If the secret is absent the step
      # skips and the build falls back to the old per-runner behaviour, so this cannot
      # break a fork or a first run before the secret is set.
      # The secret is read through `env` rather than interpolated into the script: a `${{ }}`
      # inside `run:` is substituted as raw text, which both breaks on shell metacharacters
      # and is a script-injection surface. `secrets` is also unavailable in a step-level `if`,
      # so the absent case is handled in the script instead of as a condition.
      - name: Restore the stable debug signing key
        # RV-198. Published builds only. A PR run builds an APK that is never published, so
        # decoding the signing key there put the credential the owner's installed APK is signed
        # with into every run a workflow change could reach, for no gain. On a PR the step is
        # skipped and the build falls back to a per-runner key — the same path already taken when
        # the secret is unset.
        #
        # The release call needs it just as much as a push does: an APK attached to a tag and
        # signed with a throwaway key cannot install over the one already on the phone, and the
        # way through would be an uninstall, which destroys the Oura ring's BLE key. On a `push`
        # run `inputs` is undefined, and GitHub coerces that to '' — so this is false there.
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          KEY_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set, so this APK is signed with a"
            echo "::warning::throwaway per-runner key and will NOT install over an existing copy."
            echo "::warning::The certificate check below will refuse to publish it. See"
            echo "::warning::docs/canonical-runtime-android.md for how to set the secret."
            exit 0
          fi
          printf '%s' "$KEY_B64" | base64 -d > android/debug-signing.keystore
          if [ ! -s android/debug-signing.keystore ]; then
            echo "Decoded keystore is empty — the secret is set but malformed."
            exit 1
          fi
          echo "Stable debug key restored; APKs will upgrade in place."

      # The unit tests cover src/main, which both flavours share, so one variant runs them.
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testProdDebugUnitTest --no-daemon

      # #2367. Reads what each APK will actually package — the merged manifest and the merged
      # Capacitor assets — and fails if TrainingAi Dev regains a ring, strap or scale service or
      # receiver, a connectedDevice service, a Bluetooth or Health Connect permission, the in-WebView
      # BLE or Health Connect plugin, the real app's sign-in scheme, or a non-localhost server; or if
      # the real app's Capacitor config is anything but the one `npx cap sync` wrote. The ring's
      # history only moves forward, so a Dev app that drained it would lose those nights from
      # production. The rules live in android/app/build.gradle (VerifyFlavour), and assembling either
      # APK depends on them too, so a local build cannot skip them; this step only names the failure.
      - name: Check the Dev app cannot reach the ring, strap or scale
        working-directory: android
        run: ./gradlew :app:verifyDevDebugFlavour :app:verifyProdDebugFlavour --no-daemon

      - name: Assemble both debug APKs
        working-directory: android
        run: ./gradlew :app:assembleProdDebug :app:assembleDevDebug --no-daemon

      # Flavours moved the outputs to apk/<flavour>/debug/app-<flavour>-debug.apk. The real app keeps
      # the name it has always been published under: the More -> update card and Download APK find it
      # as the `.apk` on apk-latest, and the stable download URL ends in app-debug.apk.
      - name: Name the APKs
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/prod/debug/app-prod-debug.apk app-debug.apk
          cp android/app/build/outputs/apk/dev/debug/app-dev-debug.apk app-dev-debug.apk

      # Published builds only (the key is not restored on a PR, RV-198). The installed app is signed
      # with this certificate, and an APK signed by anything else cannot install over it — the way
      # through would be an uninstall, which destroys the Oura ring's BLE key. So a mismatch fails
      # here, before either release is touched, rather than reaching the owner's update card. This
      # includes the secret being unset, which used to publish a throwaway-signed APK with a warning.
      # If the key is ever deliberately rotated (docs/canonical-runtime-android.md), change the digest
      # in the same PR. Forks have their own key, so the check runs on this repository only.
      - name: Check the signing certificate before anything is published
        if: (github.event_name == 'push' || inputs.release_tag != '') && github.repository == 'nekodas-neko/TrainingAi_Open'
        env:
          EXPECTED_CERT_SHA256: d390062e367da6eee52ee74ca18632eae7686e5edb9c0c25e2fc98a3744d893c
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in app-debug.apk app-dev-debug.apk; do
            got=$("$APKSIGNER" verify --print-certs "$apk" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}' | sort -u)
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk is signed by '${got:-nothing}', not the installed app's certificate ($EXPECTED_CERT_SHA256). Nothing was published."
              exit 1
            fi
            echo "$apk is signed by $got, the installed app's certificate."
          done

      - uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: app-dev-debug-apk
          path: app-dev-debug.apk
          retention-days: 14

      # On merge to main only (not PRs): publish the freshly-built APK to a single
      # rolling "apk-latest" release so there's always one stable, non-expiring
      # download — no need to log into the Actions run or rebuild locally. The
      # workflow-artifact above stays for PR builds (which never touch releases).
      # Stable URL: /releases/download/apk-latest/app-debug.apk
      - name: Publish APK to the rolling "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES="Auto-built from \`main\` @ ${GITHUB_SHA::7} (v$VERSION). Debug build for sideloading on the S25 — download \`app-debug.apk\` below."
          # Q-459: swap only the ASSET, never delete-then-recreate the release+tag.
          # gh can't overwrite an existing asset of the same name in place, so a
          # replace still needs a delete — but deleting just the asset leaves the
          # release id and tag alive throughout, so /releases/tags/apk-latest (what
          # /api/download-apk resolves against) never 404s. Only the direct asset
          # download URL has a brief gap between the two gh calls, not the whole
          # window a delete-release-and-recreate used to open.
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release delete-asset apk-latest app-debug.apk --yes 2>/dev/null || true
            gh release upload apk-latest app-debug.apk
            gh release edit apk-latest --title "Latest debug APK (v$VERSION)" --notes "$NOTES"
          else
            gh release create apk-latest \
              app-debug.apk \
              --title "Latest debug APK (v$VERSION)" \
              --notes "$NOTES" \
              --prerelease
          fi

      # TrainingAi Dev gets a rolling release of its own and NEVER goes on apk-latest:
      # lib/github-release.ts serves the first `.apk` it finds there to the in-app update card, so a
      # second APK on it could offer the owner the Dev app as an "update".
      # Stable URL: /releases/download/apk-dev-latest/app-dev-debug.apk
      - name: Publish the Dev APK to its own rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NOTES="Auto-built from \`main\` @ ${GITHUB_SHA::7} (v$VERSION). TrainingAi Dev (com.trainingai.app.dev): installs beside the real app, never over it, and loads the laptop's dev server over \`adb reverse\`. Download \`app-dev-debug.apk\` below."
          if gh release view apk-dev-latest >/dev/null 2>&1; then
            gh release delete-asset apk-dev-latest app-dev-debug.apk --yes 2>/dev/null || true
            gh release upload apk-dev-latest app-dev-debug.apk
            gh release edit apk-dev-latest --title "Latest TrainingAi Dev APK (v$VERSION)" --notes "$NOTES"
          else
            gh release create apk-dev-latest \
              app-dev-debug.apk \
              --title "Latest TrainingAi Dev APK (v$VERSION)" \
              --notes "$NOTES" \
              --prerelease
          fi

      # A release tag gets its own copy of the real app, named for the version. apk-latest keeps
      # tracking `main` for the between-releases dev loop; this one never moves, so re-installing a
      # given release later means installing the same bytes. The Dev app is not attached: it is a
      # WebView pointed at the laptop, the same for every release.
      - name: Attach the APK to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cp app-debug.apk "app-${TAG}.apk"
          gh release upload "$TAG" "app-${TAG}.apk" --clobber
