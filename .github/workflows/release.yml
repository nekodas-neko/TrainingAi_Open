name: Release

# The release train (docs/superpowers/specs/2026-10-05-release-train-design.md).
#
# Merging to `main` no longer reaches production once Railway's auto-deploy is off. Production
# changes only when this workflow runs, which happens after the owner says "approve" in the
# Orchestrator's chat. It ships the exact commit that was tested.
#
# ORDER IS DELIBERATE: deploy, confirm, THEN tag. A tag means "this shipped", and the `v*` ruleset
# blocks tag deletion — so a tag created before a failed deploy would be permanent garbage pointing
# at a commit that never ran in production.
#
# That ordering is also why the `release` environment must NOT be restricted to `v*` tags: at
# deploy time the ref is still `main`, because the tag does not exist yet.

# THREE MODES, one workflow, because all three are "make production serve commit X":
#   release   `version` set              — deploy, confirm, tag v<version>, notes, APK.
#   hotfix    `sha` on a hotfix/* branch — the same, from a branch cut off the last tag (spec §3.4).
#   rollback  `rollback_to` set          — redeploy an EXISTING tag's commit and confirm it. No new
#                                          tag: the old one already names that commit, and the
#                                          ruleset would refuse to move it anyway.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release: the version, without the leading v (e.g. 1.487.0). Blank for a rollback.'
        type: string
        required: false
      sha:
        description: 'Release: commit to ship (full SHA). Blank = current main. Ignored for a rollback.'
        type: string
        required: false
      rollback_to:
        description: 'Rollback: an existing tag to redeploy (e.g. v1.486.11). Leave version blank.'
        type: string
        required: false
      dry_run:
        description: 'Run the checks only — no deploy, no tag'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the commit is releasable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the commit and the mode
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin

          if [ -n "$ROLLBACK_TO" ] && [ -n "$VERSION" ]; then
            echo "::error::Give a version (to release) OR rollback_to (to redeploy a tag), not both."
            exit 1
          fi
          if [ -z "$ROLLBACK_TO" ] && [ -z "$VERSION" ]; then
            echo "::error::Nothing to do: give a version to release, or rollback_to to redeploy a tag."
            exit 1
          fi

          if [ -n "$ROLLBACK_TO" ]; then
            # Only a release tag: anything else would let a rollback deploy a commit that never
            # shipped, which is a release without the release checks.
            case "$ROLLBACK_TO" in v*) ;; *) echo "::error::rollback_to must be a v* release tag."; exit 1 ;; esac
            if ! SHA="$(git rev-parse --verify --quiet "refs/tags/$ROLLBACK_TO^{commit}")"; then
              echo "::error::No tag $ROLLBACK_TO. Tags that exist: $(git tag -l 'v*' --sort=-v:refname | head -5 | tr '\n' ' ')"
              exit 1
            fi
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Rolling production back to $ROLLBACK_TO ($SHA)"
            exit 0
          fi

          SHA="${INPUT_SHA:-$(git rev-parse origin/main)}"
          SHA="$(git rev-parse --verify --quiet "$SHA^{commit}")" || { echo "::error::$INPUT_SHA is not a commit here."; exit 1; }

          # A release ships something that already passed the PR gate: a commit on main, or on a
          # hotfix/* branch cut from the last tag (spec §3.4). Anything else never had CI.
          if git merge-base --is-ancestor "$SHA" origin/main; then
            MODE=release
          elif git branch -r --contains "$SHA" | grep -qE '^\s*origin/hotfix/'; then
            MODE=hotfix
          else
            echo "::error::$SHA is not on main or a hotfix/* branch. A release ships a merged commit."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists, and the ruleset makes tags permanent. To redeploy it, use rollback_to: v$VERSION. To ship something new, bump the version."
            exit 1
          fi

          # Read package.json AT THE COMMIT BEING SHIPPED, not at whatever this run checked out:
          # the two differ whenever `sha` is not main's head. Catches a release cut before its
          # version bump merged, which would ship a build whose in-app version disagrees with its tag.
          PKG="$(git show "$SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json at ${SHA:0:12} says $PKG, but this release says $VERSION. Bump and merge first, or fix the input."
            exit 1
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$MODE of v$VERSION from $SHA"

  deploy:
    name: Deploy to production
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The token lives on this environment and nowhere else, so no other job in any workflow can
    # read it. Do NOT add a `v*` branch/tag restriction here: see the header.
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy the released commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `up` uploads this checkout and builds it, which is what makes the deploy the exact
        # commit verified above rather than whatever Railway last saw. If this proves unreliable,
        # the documented fallback is a `production` branch Railway watches, which the release moves
        # (spec §3.5) — switch to that rather than loosening the ordering above.
        run: railway up --ci --detach

  confirm:
    name: Production serves this commit
    needs: [verify, deploy]
    # The same check that used to run on every push to `main`, now that a release is what reaches
    # production. It owns the deadline and the diagnosis; this only says which commit to expect.
    uses: ./.github/workflows/deploy-check.yml
    with:
      sha: ${{ needs.verify.outputs.sha }}

  tag:
    name: Tag and publish notes
    needs: [verify, confirm]
    # A rollback redeploys a commit that already has its tag. The APK job needs this one, so it is
    # skipped with it.
    if: needs.verify.outputs.mode != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create the tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        # Created only now, once production is confirmed serving this commit. The ruleset blocks
        # updates and deletions, so this is permanent — which is the point: redeploying a tag is
        # the rollback, and it must always mean the same commit.
        run: |
          set -euo pipefail
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # Sections come from .github/release.yml, grouped by the `type:` labels on the issues the
        # merged PRs closed.
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION" --verify-tag

  apk:
    name: Attach the APK
    needs: [verify, tag]
    # The release's own copy of the APK, so installing v<x> later means installing the same bytes.
    # It runs after the notes exist because it uploads onto that release.
    uses: ./.github/workflows/android.yml
    with:
      release_tag: v${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
