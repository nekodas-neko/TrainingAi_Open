name: Release

# The release train (docs/superpowers/specs/2026-10-05-release-train-design.md).
#
# Merging to `main` no longer reaches production once Railway's auto-deploy is off. Production
# changes only when this workflow runs, which happens after the owner says "approve" in the
# Orchestrator's chat. It ships the exact commit that was tested.
#
# ORDER IS DELIBERATE: deploy, confirm, THEN tag. A tag means "this shipped", and the `v*` ruleset
# blocks tag deletion — so a tag created before a failed deploy would be permanent garbage pointing
# at a commit that never ran in production.
#
# That ordering is also why the `release` environment must NOT be restricted to `v*` tags: at
# deploy time the ref is still `main`, because the tag does not exist yet.

# THREE MODES, one workflow, because all three are "make production serve commit X":
#   release   `version` set              — deploy, confirm, tag v<version>, notes, APK.
#   hotfix    `sha` on a hotfix/* branch — the same, from a branch cut off the last tag (spec §3.4).
#   rollback  `rollback_to` set          — redeploy an EXISTING tag's commit and confirm it. No new
#                                          tag: the old one already names that commit, and the
#                                          ruleset would refuse to move it anyway.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release: the version, without the leading v (e.g. 1.487.0). Blank for a rollback.'
        type: string
        required: false
      sha:
        description: 'Release: commit to ship (full SHA). Blank = current main. Ignored for a rollback.'
        type: string
        required: false
      rollback_to:
        description: 'Rollback: an existing tag to redeploy (e.g. v1.486.11). Leave version blank.'
        type: string
        required: false
      dry_run:
        description: 'Run the checks only — no deploy, no tag'
        type: boolean
        default: false
      skip_backup:
        description: 'Deploy without taking a database backup first. Only until backups are set up, or when one cannot wait.'
        type: boolean
        default: false

# #3673 item 2: read-only by default. Only `tag` writes (the tag and the release notes), and `apk`
# uploads onto the release; each says so itself. `verify` and `deploy`, which holds the production
# token, have no write access to the repository.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the commit is releasable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the commit and the mode
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin

          if [ -n "$ROLLBACK_TO" ] && [ -n "$VERSION" ]; then
            echo "::error::Give a version (to release) OR rollback_to (to redeploy a tag), not both."
            exit 1
          fi
          if [ -z "$ROLLBACK_TO" ] && [ -z "$VERSION" ]; then
            echo "::error::Nothing to do: give a version to release, or rollback_to to redeploy a tag."
            exit 1
          fi

          if [ -n "$ROLLBACK_TO" ]; then
            # Only a release tag: anything else would let a rollback deploy a commit that never
            # shipped, which is a release without the release checks.
            case "$ROLLBACK_TO" in v*) ;; *) echo "::error::rollback_to must be a v* release tag."; exit 1 ;; esac
            if ! SHA="$(git rev-parse --verify --quiet "refs/tags/$ROLLBACK_TO^{commit}")"; then
              echo "::error::No tag $ROLLBACK_TO. Tags that exist: $(git tag -l 'v*' --sort=-v:refname | head -5 | tr '\n' ' ')"
              exit 1
            fi
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Rolling production back to $ROLLBACK_TO ($SHA)"
            exit 0
          fi

          SHA="${INPUT_SHA:-$(git rev-parse origin/main)}"
          SHA="$(git rev-parse --verify --quiet "$SHA^{commit}")" || { echo "::error::$INPUT_SHA is not a commit here."; exit 1; }

          # A release ships something that already passed the PR gate: a commit on main, or on a
          # hotfix/* branch cut from the last tag (spec §3.4). Anything else never had CI.
          if git merge-base --is-ancestor "$SHA" origin/main; then
            MODE=release
          elif git branch -r --contains "$SHA" | grep -qE '^\s*origin/hotfix/'; then
            MODE=hotfix
          else
            echo "::error::$SHA is not on main or a hotfix/* branch. A release ships a merged commit."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists, and the ruleset makes tags permanent. To redeploy it, use rollback_to: v$VERSION. To ship something new, bump the version."
            exit 1
          fi

          # Read package.json AT THE COMMIT BEING SHIPPED, not at whatever this run checked out:
          # the two differ whenever `sha` is not main's head. Catches a release cut before its
          # version bump merged, which would ship a build whose in-app version disagrees with its tag.
          PKG="$(git show "$SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json at ${SHA:0:12} says $PKG, but this release says $VERSION. Bump and merge first, or fix the input."
            exit 1
          fi

          # #4051. GitHub refuses to let this workflow's token create a tag at a commit whose
          # `.github/workflows` files differ from main's ("without `workflows` permission"). That
          # refusal only arrives at the tag step, after the deploy, which left release 1.531.0 live
          # with no tag. So ask now, while stopping is still free. A release of main's head, or of a
          # commit with no workflow change since, passes. A hotfix branch can differ from main by
          # design and a hotfix ships when production is broken, so there it is a loud warning and
          # the owner makes the tag. The comparison and the messages are in the script.
          # This is a SNAPSHOT of main taken now. A workflow change that merges to main after this
          # step and before the tag job is caught again by the tag job, but only after the deploy,
          # so merge nothing under `.github/workflows/` while a release run is in progress.
          node scripts/release-guards.js drift "$SHA" "$MODE"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$MODE of v$VERSION from $SHA"

  backup:
    name: Back up the database
    needs: verify
    # Every release that ships new code takes an encrypted, restore-checked backup first, so a
    # migration that goes wrong has something to go back to (#2867). A rollback skips it: it
    # redeploys code that already ran, and recovery should not wait on a dump.
    if: ${{ !inputs.dry_run && !inputs.skip_backup && needs.verify.outputs.mode != 'rollback' }}
    uses: ./.github/workflows/db-backup.yml
    with:
      label: v${{ inputs.version }}
    secrets: inherit

  deploy:
    name: Deploy to production
    needs: [verify, backup]
    # A skipped backup (rollback, or skip_backup) lets the deploy go ahead; a failed one stops it.
    if: >-
      ${{ !inputs.dry_run && !cancelled() && needs.verify.result == 'success'
      && (needs.backup.result == 'success' || needs.backup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The token lives on this environment and nowhere else, so no other job in any workflow can
    # read it. Do NOT add a `v*` branch/tag restriction here: see the header.
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install the Railway CLI
        # #3673 item 2: an exact release, checked against a pinned checksum, with no install script.
        # `npm i -g @railway/cli` installed whatever version npm served that minute and ran its
        # postinstall right before this job hands the CLI the production token. The binary is the
        # same file that postinstall downloads (railwayapp/cli's release asset for this version), so
        # nothing about the deploy changes. To move the version: change both lines, with the new
        # asset's sha256 (`sha256sum` of the downloaded .tar.gz), in a reviewed PR.
        env:
          RAILWAY_CLI_VERSION: 5.71.0
          RAILWAY_CLI_SHA256: 2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9
        run: |
          set -euo pipefail
          url="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/railway.tar.gz" "$url"
          echo "${RAILWAY_CLI_SHA256}  $RUNNER_TEMP/railway.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf "$RUNNER_TEMP/railway.tar.gz" -C "$RUNNER_TEMP/railway-cli" railway
          "$RUNNER_TEMP/railway-cli/railway" --version

      - name: Deploy the released commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # The project holds more than one service (the app and its database at least), and the CLI
          # refuses to guess. The name lives as a VARIABLE on the `release` environment, next to the
          # token, so renaming the service in Railway is a settings change rather than a PR.
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        # `up` uploads this checkout and builds it, which is what makes the deploy the exact
        # commit verified above rather than whatever Railway last saw. If this proves unreliable,
        # the documented fallback is a `production` branch Railway watches, which the release moves
        # (spec §3.5) — switch to that rather than loosening the ordering above.
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::RAILWAY_SERVICE is not set. Settings → Environments → release → Environment variables → add RAILWAY_SERVICE = the app service's name as Railway shows it."
            exit 1
          fi
          # `railway up` is an upload, not a git checkout, so Railway sets no RAILWAY_GIT_COMMIT_SHA.
          # Without this file the app reports no commit and the next job can never see the deploy
          # land (lib/build-sha.ts). Not committed and not gitignored — the upload must include it.
          git rev-parse HEAD > BUILD_SHA
          # By its full path: the checked binary from the step above, not whatever PATH finds.
          "$RUNNER_TEMP/railway-cli/railway" up --ci --detach --service "$RAILWAY_SERVICE"

  confirm:
    name: Production serves this commit
    needs: [verify, deploy]
    # The same check that used to run on every push to `main`, now that a release is what reaches
    # production. It owns the deadline and the diagnosis; this only says which commit to expect.
    uses: ./.github/workflows/deploy-check.yml
    with:
      sha: ${{ needs.verify.outputs.sha }}

  tag:
    name: Tag and publish notes
    needs: [verify, confirm]
    # A rollback redeploys a commit that already has its tag. The APK job needs this one, so it is
    # skipped with it.
    if: needs.verify.outputs.mode != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that writes: it pushes the tag and creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create the tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        # Created only now, once production is confirmed serving this commit. The ruleset blocks
        # updates and deletions, so this is permanent — which is the point: redeploying a tag is
        # the rollback, and it must always mean the same commit.
        #
        # Safe to re-run (#4051). If the tag is already on the remote at exactly this commit (the
        # owner made it by hand after the push was refused) the step skips it and the job goes on
        # to the notes. At any other commit it fails and nothing is moved. `verify` still refuses
        # an existing tag on a FRESH run, and on "Re-run all jobs", which re-runs `verify`. A
        # "Re-run failed jobs" does not re-run `verify`, so only that path reaches an existing tag.
        # A tag already at this commit is answered first. Otherwise the push is always attempted:
        # production is already live, so not trying protects nothing, and in hotfix mode the
        # workflow files differ from main's by design. If the files differ, a warning is printed
        # first. If the push fails, the script fetches main again: with differing files it says
        # production is live, the tag was not created and how to make it; without, it reports git's
        # own error. Git's message is quoted either way.
        run: node scripts/release-guards.js tag "$VERSION" "$SHA"

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # Sections come from .github/release.yml, grouped by the `type:` labels on the PRs.
        #
        # The start point is named EXPLICITLY as the previous v* tag. Left to itself, GitHub starts
        # from "the latest release", and the only release that existed before the first v* tag was
        # the rolling `apk-latest` prerelease, which it skips — so the first release (run #3,
        # 2026-10-05) tried to list the repository's entire history and GitHub refused the body as
        # over 125,000 characters. That left a tag with no release, because the tag is pushed
        # first and cannot be withdrawn. With no previous v* tag there is nothing to diff against,
        # so the first release gets a fixed note instead.
        #
        # Safe to re-run (#4051): a release that already exists is left alone, so finishing a
        # release by hand and then re-running the failed jobs goes straight on to the APK. Only gh's
        # own "release not found" counts as absent; any other failure stops the step.
        run: |
          set -euo pipefail
          rc=0
          node scripts/release-guards.js release-exists "v$VERSION" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          elif [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi
          git fetch --quiet --tags origin
          PREV="$(git tag -l 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -1 || true)"
          if [ -n "$PREV" ]; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
              --generate-notes --notes-start-tag "$PREV"
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
              --notes "The first release under the release train. Later releases list the PRs merged since the previous one."
          fi

  apk:
    name: Attach the APK
    needs: [verify, tag]
    # The release's own copy of the APK, so installing v<x> later means installing the same bytes.
    # It runs after the notes exist because it uploads onto that release.
    uses: ./.github/workflows/android.yml
    with:
      release_tag: v${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
