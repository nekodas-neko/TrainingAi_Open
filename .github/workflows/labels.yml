name: Sync labels

# `.github/labels.yml` is the source of truth for the issue label set; this applies it.
# A label edited in the GitHub UI is reverted on the next sync, which is the point.

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - 'scripts/sync-labels.js'
      - '.github/workflows/labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Apply .github/labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-labels.js
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
