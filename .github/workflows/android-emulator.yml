name: Android Emulator

# NOTE: this workflow is `workflow_dispatch`-only until Q-250 restores its `pull_request` trigger, so
# the LA-17 action bumps below are UNVERIFIED — no PR can run them. They match the versions ci.yml
# and android.yml verified on a real run; re-check them when Q-250 turns this job back on.

# Q-250. Runs the local SQLite migrations against a real Android SQLite, in an emulator.
#
# Why this job exists: the local store has been silently killed twice by migration bugs (a WAL
# pragma inside the upgrade transaction, #27; a non-idempotent ADD COLUMN rolling back the whole
# version, #85), and each time every local read returned empty — the root of the recurring "my data
# disappeared" reports. Until now a migration's first real execution was on the owner's phone.
# The 466 test files never open the app, and the E2E harness drives the *web* build, where
# getLocalStore returns null and the device branch never runs at all.
#
# This cannot run in a Claude session and that is settled — /dev/kvm does not exist there and
# /proc/cpuinfo reports neither vmx nor svm (Firecracker microVM). GitHub's ubuntu-latest runners
# do expose KVM, which is why it has to live here.
#
# It is deliberately SELF-CONTAINED: a seeded Postgres and a local Next server, with the APK built
# against the emulator's host loopback instead of capacitor.config.ts's Railway URL. That means it
# needs neither production nor a staging environment — an emulator pointed at production would put
# CI write traffic on the real database, and connection-pool exhaustion there has taken the app
# down twice (Q-107, Q-308).
#
# NOT a required status check, matching android.yml. A flaky emulator must never block a merge.
#
# What it does NOT cover, and must not be described as covering: anything involving a radio (no
# emulator produces a paired Ring 5, Polar H10 or Renpho scale), and Samsung's WebView — this is
# stock Chromium, so the compositor bugs stay invisible to it.

# ⛔ DISABLED 2026-08-17 — manual trigger only, pending Q-250's sign-in driving.
#
# Everything up to the assertion works and was proven on a real runner: the app builds, the server
# starts, the APK assembles against the host loopback, KVM comes up and the emulator boots. The
# assertion itself cannot pass, and could never have passed:
#
#   getLocalStore(userId) requires a signed-in user (lib/local-store/index.ts). The app launches to
#   the sign-in screen, so no local SQLite database is ever created, and the smoke script polls 90
#   seconds for a file that cannot appear.
#
# Driving sign-in needs a UI automation tool (Maestro is the intended one — see Q-250), not a shell
# script. Until that lands this job fails every run, and a permanently-red check is worse than no
# check: it trains everyone to ignore the signal, so the next red — a genuine migration failure,
# which is the entire point of this job — goes unread.
#
# Left as workflow_dispatch rather than deleted: the hard parts are done and working, and the next
# session needs them rather than a blank file. Restore the `pull_request` block below when the
# Maestro flow lands.
on:
  workflow_dispatch:
  # Restore on Q-250 completion:
  # pull_request:
  #   branches: [main]
  #   paths:
  #     # Native paths, as android.yml.
  #     - 'android/**'
  #     - 'capacitor.config.ts'
  #     - 'pnpm-lock.yaml'
  #     - '.github/workflows/android-emulator.yml'
  #     # The reason this job is not simply folded into android.yml: the migrations it exists to
  #     # exercise are TypeScript, and changing them touches none of the native paths above.
  #     - 'lib/sqlite/**'
  #     - 'lib/local-store/**'

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Local SQLite on a real Android runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trainingai_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Q-311. Throwaway literals for this ephemeral job, not redacted secrets — see the same
      # note on the E2E job in ci.yml. `AUTH_SECRET` signs cookies for a server and a database
      # that are destroyed with the runner; the rest are never called.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trainingai_ci
      AUTH_SECRET: emulator-ci-secret-not-used-outside-this-job
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/callback/google
      GOOGLE_GENERATIVE_AI_API_KEY: placeholder
      HEALTH_CONNECT_INGEST_SECRET: placeholder
      WEBHOOK_USER_ID: placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      # Node 22, not 20: the Capacitor CLI 8.x (`npx cap sync`) requires >=22.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Apply all migrations
        run: node scripts/local-db/migrate.js

      - name: Seed the test user and program
        run: psql "$DATABASE_URL" -f scripts/local-db/seed.sql

      - name: Point the build at the host loopback instead of Railway
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const p = 'capacitor.config.ts';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(
            /url: 'https:\/\/trainingai-production\.up\.railway\.app'/,
            "url: 'http://10.0.2.2:3000'",
          );
          s = s.replace(/cleartext: false/, 'cleartext: true');
          if (!s.includes('10.0.2.2')) {
            console.error('capacitor.config.ts server.url did not match — refusing to build an APK still pointed at production.');
            process.exit(1);
          }
          fs.writeFileSync(p, s);
          EOF
          grep -n "url:\|cleartext:" capacitor.config.ts

      # Still built, because `npx cap sync` copies `www/` into the APK. The SERVER below is `pnpm
      # dev`, not this build's output — see the step's own note.
      - name: Build the app
        run: pnpm build

      # Readiness means "accepting connections", not "this endpoint returns 200". The probe asks for
      # `/` and treats ANY HTTP status as up — middleware redirects it to /sign-in (307), which is a
      # perfectly good proof that the server is listening.
      #
      # Do not probe /api/version. It looks like the obvious health endpoint and is the one thing
      # here that must not be used: it awaits lookupLatestApkRelease(), an outbound call to the
      # GitHub Releases API, before it responds. With no GITHUB_RELEASES_TOKEN in CI that call is
      # slow or hangs, so the probe timed out against a server that had been up for a minute.
      # Q-250: `pnpm dev`, NOT `pnpm start`, and this is the load-bearing choice in the whole job.
      #
      # `next start` sets NODE_ENV=production, and `instrumentation-node.ts` has TWO gates that are
      # fatal there: model constants, and model assets. The first has an honest local substitute
      # (committed synthetic fixtures). **The second does not** — `checkModelAssets` asks object
      # storage and has no tree fallback at all, so a production-mode server cannot boot on a runner
      # with no bucket credentials. Measured across two runs: constants staged, assets still fatal.
      #
      # Both gates are correct and neither is relaxed. They key on NODE_ENV rather than on whether
      # credentials are set, precisely so a production deploy that lost its storage variables fails
      # instead of quietly serving degraded sleep staging — the fail-open shape CLAUDE.md forbids.
      # Adding a CI escape hatch to `fatalOrLoud` would be exactly that shape and is not done here.
      #
      # A dev server sidesteps both without touching either: outside production the same gates say
      # so loudly and continue, and `ensureConstantsAvailable` reaches its documented fixtures
      # fallback on its own. Nothing this job asserts is affected — it checks that local SQLite
      # migrations apply inside a real Android WebView, which is identical either way. The cost is a
      # slower first paint, which the 120 s probe and the flow's 120 s waits already absorb.
      - name: Start the server
        run: |
          pnpm dev > /tmp/next-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server process exited during startup:"; cat /tmp/next-server.log; exit 1
            fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/ || true)
            # Q-250: 5xx is NOT up. This used to accept any status, so a server whose
            # instrumentation hook had thrown reported "server up (HTTP 500)" and the job carried on
            # to fail 8 minutes later inside the emulator, where it read as a UI-automation problem.
            # A readiness probe that passes on 500 is worse than none — it moves the error away
            # from its cause.
            case "$CODE" in
              ''|000|5*) ;;
              *) echo "server up after ${i}s (HTTP $CODE)"; exit 0 ;;
            esac
            sleep 1
          done
          echo "server never accepted a connection in 120s:"; cat /tmp/next-server.log; exit 1

      # Q-250. `next dev` compiles routes ON FIRST REQUEST, and the probe above only ever asks for
      # `/`, which 307s to /sign-in WITHOUT compiling it. So the emulator's very first page load was
      # paying for that compile inside Maestro's wait — run 3 failed with the emulator up, the
      # server up, and the form simply not painted within 120 s. Warming it here moves the compile
      # onto the host, where it costs seconds and is visible, instead of into a UI timeout that
      # reads as "Maestro cannot see the form".
      - name: Warm the routes the flow will actually load
        run: |
          for path in / /sign-in; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "http://localhost:3000$path" || true)
            echo "warmed $path -> HTTP $CODE"
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync and assemble the debug APK
        run: |
          mkdir -p www
          npx cap sync android
          cd android && ./gradlew :app:assembleDebug --no-daemon

      # Q-250. Maestro drives the sign-in the assertion depends on. Installed on the HOST, not in
      # the emulator: it drives the device over adb from outside, the same way the smoke script does.
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM has to be made available to the runner user before the emulator action runs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator and assert the local schema version
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/emulator-local-db-smoke.sh

      - name: Server log
        if: always()
        run: tail -100 /tmp/next-server.log || true

      # Q-250. The emulator step's own output is buried under the runner's boot spam and, after it,
      # the Postgres container dump — so reading this job's verdict has meant pulling hundreds of
      # log lines, and not being able to is what capped the investigation at four runs. This prints
      # the three lines that decide the diagnosis, last, where the smallest possible tail finds them.
      - name: Verdict
        id: verdict
        if: always()
        run: |
          echo '================ Q-250 VERDICT ================'
          cat /tmp/q250-verdict.txt 2>/dev/null || echo 'no verdict file — the job died before the emulator step'
          echo '==============================================='
          if grep -q 'candidate (a)' /tmp/q250-verdict.txt 2>/dev/null; then echo 'answer=a' >> "$GITHUB_OUTPUT"
          elif grep -q 'candidate (b)' /tmp/q250-verdict.txt 2>/dev/null; then echo 'answer=b' >> "$GITHUB_OUTPUT"
          elif [ -s /tmp/q250-verdict.txt ]; then echo 'answer=passed' >> "$GITHUB_OUTPUT"
          else echo 'answer=none' >> "$GITHUB_OUTPUT"; fi
          # Second axis, for the candidate-(a) case: does the tree contain the form's text at all?
          # An absent tree and a full tree with no matching text are different bugs with different
          # fixes, and the step names below are the only place that distinction survives.
          if grep -qE 'sign-in text visible to Maestro: [1-9]' /tmp/q250-verdict.txt 2>/dev/null; then
            echo 'tree=text-present' >> "$GITHUB_OUTPUT"
          elif [ -s /tmp/maestro-hierarchy.txt ]; then echo 'tree=no-text' >> "$GITHUB_OUTPUT"
          else echo 'tree=absent' >> "$GITHUB_OUTPUT"; fi
          # Third axis: did the WebView ever ASK the server for the sign-in page? A tree with no form
          # text means one of two things, and only the server's access log tells them apart.
          if grep -qE 'server saw /sign-in requests: [1-9]' /tmp/q250-verdict.txt 2>/dev/null; then
            echo 'page=served' >> "$GITHUB_OUTPUT"
          else echo 'page=never-requested' >> "$GITHUB_OUTPUT"; fi

      # Q-250. The verdict is carried by these steps' NAMES, not by their output, and that is the
      # whole point. This job's log ends with the runner's own post-job blocks — artifact upload, git
      # cleanup, the Postgres container dump — which nothing in the job can print after, so reading a
      # verdict from the log tail means pulling a hundred-plus lines every time and often missing it
      # anyway. Four attempts went that way before this. A step listing gives the step names for
      # free, so exactly one of these running is the answer, readable without opening a log at all.
      - name: 'VERDICT A — reachability OK, Maestro could not find the sign-in form'
        if: always() && steps.verdict.outputs.answer == 'a'
        run: grep -E 'hierarchy bytes|sign-in text' /tmp/q250-verdict.txt || true
      - name: 'VERDICT B — the emulator could not reach the host server'
        if: always() && steps.verdict.outputs.answer == 'b'
        run: grep 'candidate (b)' /tmp/q250-verdict.txt || true
      - name: 'VERDICT — reachability OK and Maestro passed; the failure is later'
        if: always() && steps.verdict.outputs.answer == 'passed'
        run: cat /tmp/q250-verdict.txt || true
      - name: 'VERDICT — none, the job died before the emulator step'
        if: always() && steps.verdict.outputs.answer == 'none'
        run: 'true'

      - name: 'TREE — the sign-in text IS in the hierarchy, so this is not WebView opacity'
        if: always() && steps.verdict.outputs.answer == 'a' && steps.verdict.outputs.tree == 'text-present'
        run: 'true'
      - name: 'TREE — a hierarchy came back but carries no sign-in text'
        if: always() && steps.verdict.outputs.answer == 'a' && steps.verdict.outputs.tree == 'no-text'
        run: 'true'
      - name: 'TREE — no hierarchy at all'
        if: always() && steps.verdict.outputs.answer == 'a' && steps.verdict.outputs.tree == 'absent'
        run: 'true'

      - name: 'PAGE — the server did serve /sign-in, so the form rendered and the driver cannot read it'
        if: always() && steps.verdict.outputs.answer == 'a' && steps.verdict.outputs.page == 'served'
        run: 'true'
      - name: 'PAGE — the WebView never requested /sign-in, so there was no form to find'
        if: always() && steps.verdict.outputs.answer == 'a' && steps.verdict.outputs.page == 'never-requested'
        run: 'true'

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: emulator-diagnostics
          path: |
            /tmp/next-server.log
            /tmp/logcat.txt
            /tmp/logcat-launch.txt
            /tmp/pulled-local.db
            /tmp/maestro-report.xml
            /tmp/maestro-hierarchy.txt
            /tmp/q250-verdict.txt
          retention-days: 7
          if-no-files-found: ignore
