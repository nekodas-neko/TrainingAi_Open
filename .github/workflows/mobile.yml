name: Mobile client

# Runs on EVERY pull request to main, with no `paths:` filter on the trigger (#3803). A trigger
# filter means the workflow never starts on an unrelated PR, so a check required by the ruleset
# would never report and the PR could never merge. Instead the `changes` job below decides whether
# the real work is needed, and `Mobile client` publishes one pass/fail either way — the same shape
# as `changes` / `test` in ci.yml. Require the check named exactly `Mobile client`.
on:
  pull_request:
    branches: [main]
  # #4118: a pull request can read only its own caches and main's. This workflow never ran on main, so the
  # compile job's Gradle cache (which holds the test-only artifacts, Robolectric's) was written on a PR ref and
  # no other PR could read it: every new PR downloaded Robolectric from Maven Central, and a 429 there failed
  # the check on pull requests that never touched Android. A push to main that changes what decides the cache
  # key (the same files `hashFiles` reads in the job below, this workflow and the shared Android actions) runs
  # the job once on main, which saves the cache every PR then restores. `workflow_dispatch` on main warms it by
  # hand (after the cache was evicted, or before the first push).
  push:
    branches: [main]
    paths:
      - mobile/package.json
      - mobile/pnpm-lock.yaml
      - mobile/modules/*/android/build.gradle
      - .github/workflows/mobile.yml
      - .github/actions/android-ndk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides `mobile` (typecheck, lint, tests, export) and `native` (the 35-minute Android compile).
  # `app/api/**` runs the JS checks because the app calls those routes, but not the native compile,
  # which no server route can affect. Fails SAFE: not a PR, an API error, an empty list or 3,000+
  # files (the API's cap) all give `true` for both. Renames count their old path too.
  changes:
    name: Mobile changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.classify.outputs.mobile }}
      native: ${{ steps.classify.outputs.native }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          mobile=true
          native=true
          if [ "$EVENT" = pull_request ] && files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            n=$(printf '%s\n' "$files" | grep -c . || true)
            if [ "$n" -gt 0 ] && [ "$n" -lt 3000 ]; then
              native_re='^(mobile/|packages/shared/|\.github/workflows/mobile\.yml$|\.github/actions/android-ndk/)'
              printf '%s\n' "$files" | grep -qE "$native_re" || native=false
              printf '%s\n' "$files" | grep -qE "$native_re|^app/api/" || mobile=false
            fi
            echo "$n changed paths"
          fi
          echo "mobile=$mobile native=$native"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  mobile:
    name: Mobile client checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.0
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec expo export --platform all --output-dir dist
        env:
          CI: '1'
      # #3761: the browser preview's development sign-in must not reach a release bundle.
      - run: node scripts/check-release-bundles.mjs dist

  # The name to require. Publishes one pass/fail for the job above; installs nothing. `always()` so
  # it still reports when that job fails or `changes` errors — without it this job is SKIPPED and a
  # required check never arrives. A skipped `mobile` passes only when `changes` itself succeeded and
  # said no mobile-facing path changed.
  mobile-summary:
    name: Mobile client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, mobile]
    if: always()
    steps:
      - name: The mobile checks passed, or no mobile-facing path changed
        run: |
          echo "changes: ${{ needs.changes.result }} (mobile=${{ needs.changes.outputs.mobile }}) · checks: ${{ needs.mobile.result }}"
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.mobile }}" = "false" ]; then
            test "${{ needs.mobile.result }}" = "skipped"
          else
            test "${{ needs.mobile.result }}" = "success"
          fi

  android-compile:
    name: Native Android compile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ubuntu-latest
    # 45, not 35 (#4118): the retry below may wait up to 9 minutes (60 + 180 + 300 s) in each of the two Gradle
    # steps, and the job has to fit those waits and a full build inside its limit, or a rate limit would end
    # as a timeout with no message.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EAS_BUILD_PROFILE: android-development
      EXPO_NO_DOTENV: '1'
      # Waits before each retry of a failed DOWNLOAD (gradle-retry.sh): Maven Central's 429 can outlast one minute.
      # Only a failed download is retried; a failing test or a compile error ends the job at once.
      GRADLE_RETRY_WAITS: '60 180 300'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.0
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --no-install
      - name: Android NDK
        uses: ./.github/actions/android-ndk
      # Heap, heap log and the one-retry helper: one copy, shared with the other Android build.
      - name: Gradle heap and retry helper
        uses: ./.github/actions/android-ndk/gradle

      # The key is built only from committed files that decide dependencies. Never from
      # mobile/android/**: prebuild generates it, with the minute-based ANDROID_VERSION_CODE in it,
      # so a key over it changes every run and saves a new entry each time.
      # A new PR has no cache of its own: its first run restores the one a push to main saved (this
      # workflow's `push` trigger, #4118; the key below is the same on main), else falls back to the cache the
      # Preview build saves on main (restore-keys, second line), which has no test-only artifacts, so a cold
      # run downloads Robolectric once, which the retry covers.
      # ~/.m2/repository (#4118): Robolectric does not fetch its android-all jar through Gradle but at TEST
      # time with its own client, into the local Maven repository (MavenDependencyResolver: maven.repo.local,
      # else ~/.m2/repository), and treats a file already there as fetched. The cache did not hold that
      # directory, so every run downloaded the jar from Maven Central however warm ~/.gradle was.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ runner.os }}-compile-${{ hashFiles('mobile/pnpm-lock.yaml', 'mobile/package.json', 'mobile/modules/*/android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-compile-
            gradle-${{ runner.os }}-side-by-side-
      - name: Say what the cache gave
        run: |
          echo "exact hit: '${{ steps.gradle-cache.outputs.cache-hit }}', restored from: '${{ steps.gradle-cache.outputs.cache-matched-key }}'"
          echo "::notice::Gradle cache restored from '${{ steps.gradle-cache.outputs.cache-matched-key }}' (exact key hit: ${{ steps.gradle-cache.outputs.cache-hit }})"
          ls "$HOME/.m2/repository/org/robolectric" 2>/dev/null | sed 's/^/m2 has: /' || true

      - name: Compile unpublished development APK
        run: $RUNNER_TEMP/gradle-retry.sh ./gradlew :app:assembleDebug --no-daemon
        working-directory: mobile/android
      # The local modules' JVM unit tests (PipStateTest and any that follow). Every module under
      # mobile/modules is listed, so a module that adds tests is covered without editing this.
      - name: Native module unit tests
        run: |
          tasks=$(for dir in ../modules/*/android; do echo ":$(basename "$(dirname "$dir")"):testDebugUnitTest"; done)
          "$RUNNER_TEMP/gradle-retry.sh" ./gradlew $tasks --no-daemon
        working-directory: mobile/android
