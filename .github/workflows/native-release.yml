name: Native release build

# Builds the native app (mobile/) as the REAL app, com.trainingai.app, for the switch-over that
# replaces the Capacitor app (#2840, #2849; owner's decision on #3526: build on GitHub's own
# runners, so the signing key never leaves GitHub). docs/native-testing.md has the process.
#
# Run by hand, with a version code ABOVE the installed app's (the Implementer reads it from the
# phone). The same path as native-side-by-side.yml, which has built Preview many times: `expo
# prebuild`, Gradle `assembleRelease`, then apksigner. It is the `android-preview` profile (an
# APK, not the AAB), arm64 only, JavaScript embedded, talking to production.
#
# Signed with the stable key android.yml signs the installed app with (the repository secret
# ANDROID_DEBUG_KEYSTORE_B64, the legacy name of that key). Its certificate is checked against the
# installed app's before the APK is kept.
#
# The APK is kept as a 14-day WORKFLOW ARTIFACT. By default nothing is published, and this
# workflow never touches `apk-latest`: lib/github-release.ts offers the first `.apk` there to the
# installed Capacitor app as an update.
#
# PUBLISHING (#3723) is for AFTER the switch-over only. With `publish` AND `confirm_switch_done`
# both set, a separate job attaches the checked APK to the rolling prerelease
# `native-release-latest` (never marked "latest"), which the native app's About screen offers as
# "A newer build is available". Before the switch that would be dangerous: this APK has the real
# app's ID and key and a higher version code, so anyone who downloaded and opened it would install
# it over the Capacitor app and skip the switch runbook (emptying the queues, the backup, the
# rollback build). So `publish` alone is refused, it never runs on push or a schedule, and the
# runbook (docs/runbooks/native-switch-over.md) says when it starts.
# lib/__tests__/native-release-workflow.test.ts pins all of that.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode, an integer above the installed app''s'
        type: string
        required: true
      ref:
        description: 'What to build: main, or a v* release tag'
        type: string
        required: false
        default: main
      # The switch rehearsal (native-switch-rehearsal.yml) runs on an x86_64 emulator, which cannot
      # load this APK's arm64-only libraries: they stay stored in the APK, and React Native's loader
      # looks for the emulator's own ABI there. This adds x86_64 beside arm64 and names the artifact
      # apart, so the rehearsal can start the app. It is never the APK installed on the phone.
      emulator_abi:
        description: 'Rehearsal only: also include x86_64 for the emulator. Never install this build on the phone.'
        type: boolean
        required: false
        default: false
      # #3723. Off unless asked, and refused unless confirm_switch_done is also set.
      publish:
        description: 'After the switch only: attach this APK to the native-release-latest download page'
        type: boolean
        required: false
        default: false
      confirm_switch_done:
        description: 'Required with publish: the switch-over (docs/runbooks/native-switch-over.md) is done and has held'
        type: boolean
        required: false
        default: false

# Read-only. Only the `publish` job, which runs on the two inputs above, gets a write token.
permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

env:
  PACKAGE: com.trainingai.app
  APK_NAME: TrainingAi.apk
  # The certificate of the stable key the installed app is signed with: the same digest as
  # EXPECTED_CERT_SHA256 in android.yml. Change both together if that key is ever rotated on purpose.
  EXPECTED_CERT_SHA256: d390062e367da6eee52ee74ca18632eae7686e5edb9c0c25e2fc98a3744d893c
  # The backup exclusions the built APK must carry, as `domain:path`. Pinned HERE, not only in the
  # ref's private-backups.cjs: the workflow file comes from the dispatching branch (main) while
  # `ref` may be older code, and the built APK is held to this list whatever that code says. The
  # session token, the Oura key and the health database (the SQLite folder) stay out of Google
  # backups. A test pins this list against private-backups.cjs.
  REQUIRED_BACKUP_EXCLUSIONS: |
    root:app_webview
    file:SQLite
    sharedpref:oura_ble.xml
    sharedpref:SecureStore
    sharedpref:SecureStore.xml
    sharedpref:trainingai_home_widgets.xml
    sharedpref:workout-status.xml
    database:trainingaiSQLite.db
    database:trainingaiSQLite.db-journal
    database:trainingaiSQLite.db-wal
    database:trainingaiSQLite.db-shm
    database:oura_raw.db
    database:oura_raw.db-journal
    database:oura_raw.db-wal
    database:oura_raw.db-shm
  # The permissions the built APK must declare (#3722). A floor, pinned here for the same reason
  # as the exclusions: a library, a plugin or Expo's template dropping one would otherwise ship as
  # a setting the owner can no longer grant. SYSTEM_ALERT_WINDOW is "Display over other apps",
  # which the morning Oura hand-off needs. The APK may declare more; the job summary lists them.
  REQUIRED_PERMISSIONS: |
    android.permission.health.READ_SLEEP
    android.permission.health.READ_HEART_RATE
    android.permission.health.READ_RESTING_HEART_RATE
    android.permission.health.READ_HEART_RATE_VARIABILITY
    android.permission.health.READ_STEPS
    android.permission.health.READ_ACTIVE_CALORIES_BURNED
    android.permission.health.READ_WEIGHT
    android.permission.health.READ_EXERCISE
    android.permission.health.READ_HEALTH_DATA_HISTORY
    android.permission.READ_CALENDAR
    android.permission.WRITE_CALENDAR
    android.permission.ACCESS_COARSE_LOCATION
    android.permission.ACCESS_FINE_LOCATION
    android.permission.FOREGROUND_SERVICE
    android.permission.FOREGROUND_SERVICE_LOCATION
    android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE
    android.permission.BLUETOOTH_CONNECT
    android.permission.BLUETOOTH_SCAN
    android.permission.CAMERA
    android.permission.RECORD_AUDIO
    android.permission.POST_NOTIFICATIONS
    android.permission.POST_PROMOTED_NOTIFICATIONS
    android.permission.USE_EXACT_ALARM
    android.permission.REORDER_TASKS
    android.permission.SYSTEM_ALERT_WINDOW
  # Never asked for: routes record through the foreground service, not background location.
  FORBIDDEN_PERMISSIONS: |
    android.permission.ACCESS_BACKGROUND_LOCATION
  # The two foreground services, as `class:type` (docs/module-map.md, "Preview's activity
  # foreground service"): expo-location's for a GPS recording, ours for a strap with no GPS.
  REQUIRED_FOREGROUND_SERVICES: |
    expo.modules.location.services.LocationTaskService:location
    expo.modules.activityservice.ActivityForegroundService:connectedDevice

jobs:
  build:
    name: Build and check the release APK
    # The workflow file itself must come from main: a copy edited on another branch could be
    # dispatched to sign anything. `ref` below is only the code that gets built.
    if: github.ref == 'refs/heads/main' && github.repository == 'nekodas-neko/TrainingAi_Open'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.name.outputs.name }}
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      # Not development, not side-by-side: app.config.js then gives the real ID.
      EAS_BUILD_PROFILE: android-preview
      EXPO_PUBLIC_API_URL: https://trainingai-production.up.railway.app
    steps:
      # First, before any checked-out code exists: only main or a release tag may be built, so no
      # other branch's code runs ahead of the signing step. It uses no repository files.
      - name: Check the ref
        working-directory: .
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF" = "main" ]; then
            exit 0
          fi
          if ! [[ "$REF" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::ref must be 'main' or a v* release tag, got '$REF'."
            exit 1
          fi
          # A branch could also be named v-something: the name must be an existing tag.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF" --silent || {
            echo "::error::'$REF' is not a tag in $GITHUB_REPOSITORY."
            exit 1
          }

      # Refused before anything is built, so a mistaken publish costs nothing.
      - name: Check the publish request
        working-directory: .
        env:
          PUBLISH: ${{ inputs.publish }}
          CONFIRMED: ${{ inputs.confirm_switch_done }}
          EMULATOR_ABI: ${{ inputs.emulator_abi }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            exit 0
          fi
          if [ "$CONFIRMED" != "true" ]; then
            echo "::error::publish needs confirm_switch_done too. This APK installs over the current app with the real app's key, so it is published only after the switch-over (docs/runbooks/native-switch-over.md) is done. Nothing was built."
            exit 1
          fi
          if [ "$EMULATOR_ABI" = "true" ]; then
            echo "::error::The emulator build is never published. Run again without emulator_abi."
            exit 1
          fi

      - name: Check the version code
        id: version
        working-directory: .
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          # Android stores it as a signed 32-bit integer.
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::version_code must be a positive integer up to 2100000000, got '$VERSION_CODE'."
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/${{ inputs.ref == 'main' && 'heads' || 'tags' }}/${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.0
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The commit being built (for the release, the checked-out ref, not the workflow's own sha);
      # the JS bundle inlines it for the About screen.
      - name: Record the built commit
        run: echo "EXPO_PUBLIC_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The version name the publish job writes as `(vX.Y.Z)`, which /api/version reads back.
      - name: Read the version name
        id: name
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./app.json').expo.version")"
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::app.json's version '$NAME' is not X.Y.Z."; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --no-install

      # The generated project must be the real app, at the version code that was asked for.
      - name: Check the generated project
        run: |
          set -euo pipefail
          grep -q "applicationId '$PACKAGE'" android/app/build.gradle || {
            echo "::error::The generated project is not $PACKAGE:"; grep -n applicationId android/app/build.gradle; exit 1; }
          grep -q "versionCode $ANDROID_VERSION_CODE\$" android/app/build.gradle || {
            echo "::error::The generated project's versionCode is not $ANDROID_VERSION_CODE:"; grep -n versionCode android/app/build.gradle; exit 1; }

      - name: Android NDK
        uses: ./.github/actions/android-ndk

      - name: Compile the release APK
        env:
          EMULATOR_ABI: ${{ inputs.emulator_abi }}
        run: |
          ABIS=arm64-v8a
          if [ "$EMULATOR_ABI" = "true" ]; then ABIS=arm64-v8a,x86_64; fi
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS"
        working-directory: mobile/android

      # The key is read only from here on, after every step that runs the checked-out code's build.
      # It goes through `env`, not into the script text, and is deleted as soon as it has signed.
      - name: Sign with the stable release key
        env:
          KEY_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 is not set. Without the installed app's key this APK could not install over it."
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEY_B64" | base64 -d > "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::The decoded keystore is empty: the secret is set but malformed."
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          echo "BT=$BT" >> "$GITHUB_ENV"
          # The legacy key's alias and passwords (mobile/scripts/android-signing.mjs, the same as
          # android/app/build.gradle's debugStable). assembleRelease signs with the template's debug
          # key; apksigner replaces that signature.
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --ks-key-alias androiddebugkey \
            --key-pass pass:android --out "$RUNNER_TEMP/$APK_NAME" \
            android/app/build/outputs/apk/release/app-release.apk
          rm -f "$KS"

      # Fails the job on any mismatch, so nothing is uploaded that could not replace the real app.
      - name: Check the package, certificate, version code, backup rules and permissions
        env:
          BUILT_REF: ${{ inputs.ref }}
          EMULATOR_ABI: ${{ inputs.emulator_abi }}
        run: |
          set -euo pipefail
          TOOLS="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort -V | tail -1)")"
          [ -x "$TOOLS/apkanalyzer" ] || { echo "::error::apkanalyzer is not on this runner."; exit 1; }
          node scripts/verify-release-apk.mjs \
            --apk "$RUNNER_TEMP/$APK_NAME" \
            --package "$PACKAGE" \
            --version-code "$ANDROID_VERSION_CODE" \
            --cert "$EXPECTED_CERT_SHA256" \
            --apksigner "$BT/apksigner" \
            --apkanalyzer "$TOOLS/apkanalyzer" \
            --aapt2 "$BT/aapt2" \
            --require-exclusions "$REQUIRED_BACKUP_EXCLUSIONS" \
            --require-permissions "$REQUIRED_PERMISSIONS" \
            --forbid-permissions "$FORBIDDEN_PERMISSIONS" \
            --require-foreground-services "$REQUIRED_FOREGROUND_SERVICES" | tee "$RUNNER_TEMP/verified.json"
          {
            echo "**$PACKAGE**, version code $ANDROID_VERSION_CODE, built from \`$BUILT_REF\`, $(du -h "$RUNNER_TEMP/$APK_NAME" | cut -f1)."
            echo "Signed by the installed app's certificate \`$EXPECTED_CERT_SHA256\`; the backup rules keep SecureStore, the health database and the old app's leftover databases out of Google backups."
            echo "It declares every pinned permission (\"Display over other apps\" among them) and both foreground services."
            echo "Kept as a 14-day workflow artifact. Publishing to the download page happens only in the publish job, with publish and confirm_switch_done both set."
            if [ "$EMULATOR_ABI" = "true" ]; then
              echo ""
              echo "**Emulator build for the switch rehearsal** (arm64-v8a and x86_64, artifact \`trainingai-release-apk-emulator\`). Never install it on the phone: the switch uses the arm64-only build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.emulator_abi && 'trainingai-release-apk-emulator' || 'trainingai-release-apk' }}
          path: ${{ runner.temp }}/${{ env.APK_NAME }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  # #3723. The only job with a write token, and it never builds or signs: it takes the APK the build
  # job checked (package, certificate, version code, backup rules, permissions) and attaches it to
  # the rolling download page. It runs only with both inputs set, which the build job has already
  # refused otherwise; the condition is repeated here so neither alone can publish.
  publish:
    name: Publish to the download page
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish && inputs.confirm_switch_done &&
      !inputs.emulator_abi && github.ref == 'refs/heads/main' &&
      github.repository == 'nekodas-neko/TrainingAi_Open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: native-release-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: trainingai-release-apk

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ needs.build.outputs.version_code }}
          NAME: ${{ needs.build.outputs.version_name }}
          BUILT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$CODE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::No version code from the build job. Nothing is published."; exit 1; }
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No version name from the build job. Nothing is published."; exit 1; }
          [ -s "$APK_NAME" ] || { echo "::error::The checked APK was not downloaded. Nothing is published."; exit 1; }
          R=(-R "$GITHUB_REPOSITORY")
          # lib/github-release.ts reads `(vX.Y.Z)` and `version code N` from these notes.
          TITLE="TrainingAi release build (v$NAME)"
          NOTES="$(printf '%s\n\n%s\n\n%s' \
            "TrainingAi, the native app, built from \`$BUILT_REF\` on $(date -u +%Y-%m-%d), version code $CODE (v$NAME)." \
            "For the phone AFTER the switch-over only. It installs over the TrainingAi app (\`$PACKAGE\`) and keeps its data and sign-in. Download **$APK_NAME** below and open it." \
            "Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`. How it works: docs/native-testing.md.")"
          if ! gh release view "$RELEASE_TAG" "${R[@]}" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${R[@]}" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$TITLE" --notes "$NOTES"
          fi
          gh release delete-asset "$RELEASE_TAG" "$APK_NAME" --yes "${R[@]}" 2> /dev/null || true
          gh release upload "$RELEASE_TAG" "$APK_NAME" "${R[@]}"
          gh release edit "$RELEASE_TAG" "${R[@]}" --prerelease --latest=false --title "$TITLE" --notes "$NOTES"
          echo "Published version code $CODE (v$NAME): https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
