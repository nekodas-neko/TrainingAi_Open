name: Backlog migration

# Release-train Phase 3: docs/implementation-backlog.md → GitHub Issues, from the verdicts in
# docs/superpowers/specs/2026-10-05-backlog-triage.csv. One-off; retire this file once it has run.
#
# Dry run by default: it builds the plan and writes it to the run's summary page and an artifact,
# and creates nothing. The owner glances at that, then it runs for real.
#
# Safe to re-run. Every issue carries a `backlog-id` marker and a re-run skips any id already on an
# open or closed issue, so a run that dies halfway is finished by running it again.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and show the plan only — create nothing'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: backlog-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Move the backlog into issues
    runs-on: ubuntu-latest
    # ~250 creates plus ~70 edits at one write per 1.5 s, under GitHub's content-creation limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Labels first, so every label the plan uses exists
        if: ${{ !inputs.dry_run }}
        run: node scripts/sync-labels.js
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Build the plan
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/backlog-to-issues.js --plan plan.json

      - uses: actions/upload-artifact@v6
        with:
          name: backlog-migration-plan
          path: plan.json
          retention-days: 30

      - name: Create the issues
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/backlog-to-issues.js --apply
