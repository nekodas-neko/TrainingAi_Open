# Groups the auto-generated release notes (`gh release create --generate-notes`, used by
# .github/workflows/release.yml). Categories match the `type:` labels in .github/labels.yml.
changelog:
  exclude:
    labels:
      - 'type: chore'
      - 'type: question'
  categories:
    - title: Fixes
      labels: ['type: bug', 'hotfix']
    - title: New
      labels: ['type: feature']
    - title: Scoring and calibration
      labels: ['type: tuning']
    - title: Everything else
      labels: ['*']
