plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.trainingai'
version = '0.1.0'

android {
  namespace "expo.modules.workoutstatus"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  // expo-modules-core already exposes this as `api`; stated here because the notification builder
  // needs 1.17.0's setRequestPromotedOngoing / setShortCriticalText.
  implementation 'androidx.core:core-ktx:1.17.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16'
  testImplementation 'androidx.test:core:1.7.0'
}
